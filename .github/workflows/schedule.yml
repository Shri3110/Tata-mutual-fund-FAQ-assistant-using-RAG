name: Daily Data Ingestion Schedule

on:
  schedule:
    # 10:30 AM IST is 05:00 AM UTC. This matches your scheduler.py timing.
    - cron: '0 5 * * *'
  workflow_dispatch: # This allows you to manually trigger the workflow from the GitHub UI if needed

jobs:
  run-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Script
        env:
          # Your script likely needs API keys like Groq. 
          # You MUST add GROQ_API_KEY as a Repository Secret in GitHub (Settings > Secrets and variables > Actions)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python run_ingestion.py
